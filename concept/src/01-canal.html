<!doctype html><html><head><meta charset="utf-8"></head><body>
<script src="lib.js"></script><script src="vehicles.js"></script>
<script>
// ===== Cena 1: Canal das Ruínas (terra) =====
const ctx = setup(1920,1080);
seed(11);
const HUD=location.search.includes('hud');
const cam = HUD ? Camera([0.3, 7.2, -9], 9.5, 60, 0) : Camera([0.6, 4.4, -7], 3.2, 60, 0);
const Lv=[0.42,0.52,0.74], Ln=Math.hypot(...Lv), L=Lv.map(v=>v/Ln);
const xc = z => z<30 ? 0 : 0.0021*(z-30)**2;
const head = z => Math.atan(z<30?0:0.0042*(z-30));
function W3(u,v,z){ const a=head(z); return [xc(z)+u*Math.cos(a), v, z-u*Math.sin(a)]; }
function P(u,v,z){ const w=W3(u,v,z); return cam.project(w[0],w[1],w[2]); }
const HAZE='#f4ead3';
const atm=(c,zc,k=1)=>mix(c,HAZE,clamp((1-Math.exp(-zc/300))*k,0,0.9));

// ---------- céu ----------
skyGrad(ctx, [[0,'#3f8fd6'],[0.28,'#7db8ea'],[0.44,'#cfe4ef'],[0.5,'#f6eedb'],[1,'#f6eedb']]);
glow(ctx, 1700, -120, 900, '#fff4d8', 0.55, 'screen');
// nuvens grandes no horizonte
const CL={lit:'#fffaf0', mid:'#f3ecf2', shd:'#c7c8e6', deep:'#a9acd8', lx:0.6, ly:-0.8};
seed(3); cloud(ctx, 640, 470, 900, 330, CL);
seed(5); cloud(ctx, 1420, 465, 620, 230, CL);
seed(8); cloud(ctx, 1800, 470, 480, 170, CL);
seed(9); cloud(ctx, 160, 470, 420, 150, CL);
seed(21); cloud(ctx, 1150, 175, 380, 80, Object.assign({},CL,{alpha:0.85}));
seed(22); cloud(ctx, 300, 130, 300, 60, Object.assign({},CL,{alpha:0.7}));
// mesas distantes
seed(4);
for(const [x0,x1,h,c] of [[-50,700,40,'#b9b6d6'],[500,1300,28,'#c4c0dc'],[1100,2000,46,'#b3b2d4']]){
  const pts=[[x0,485]]; for(let x=x0;x<=x1;x+=30){ pts.push([x, 485-h*(0.6+0.4*Noise.fbm(x*0.004,h,3)*2)]); } pts.push([x1,485]);
  poly(ctx, rough(pts,2,10,0.03), css(c));
}

seed(12); birds(ctx, 1180, 250, 160, 14, 9, 'rgba(255,255,255,0.9)'); birds(ctx, 760, 330, 90, 7, 6, 'rgba(255,255,255,0.8)');
// ---------- perfil do canal ----------
const hv=[[0,-0.25],[1.8,-0.25],[2.5,0],[7,0]], hm=['water','water','grass'];
for(let k=1;k<=10;k++){ const th=k/10*Math.PI/2; hv.push([7+7*Math.sin(th),7-7*Math.cos(th)]); hm.push('wall'); }
for(const vv of [8.6,10.2,11.9,13.6]){ hv.push([14,vv]); hm.push('wall'); } hv.push([14.8,13.8]); hm.push('cap'); hv.push([14.8,15.9]); hm.push('band'); hv.push([14.8,16.6]); hm.push('cap'); hv.push([80,16.6]); hm.push('top');
const PV=[...hv.slice(1).reverse().map(([u,v])=>[-u,v]), ...hv];
const PM=[...hm.slice().reverse(), ...hm];
const MAT={
  wall:{hi:'#f8e9c8',mid:'#ecd6ad',lo:'#d9bf93',sh:'#8f8ab4'},
  cap:{hi:'#fbf3e0',mid:'#efe2c6',lo:'#ddcca8',sh:'#a7a2c2'},
  band:{hi:'#e9824a',mid:'#d66e3e',lo:'#bb5a38',sh:'#8a4a5a'},
  grass:{hi:'#a3cc62',mid:'#93c05a',lo:'#7fae52',sh:'#527f72'},
  water:{hi:'#eaf7f1',mid:'#d6eeea',lo:'#bfe0e0',sh:'#8fb0c8'},
  top:{hi:'#9fc666',mid:'#8cb85a',lo:'#79a651',sh:'#5a7d6c'},
};
function tone(m,d,v=0){ const M=MAT[m]; if(d<=0.03) return m==='wall'? mix(M.sh,'#c9a6a6',clamp(1-v/13,0,1)*0.45) : M.sh; return d>0.62?M.hi: d>0.35?M.mid: M.lo; }

const N=150, ZS=[]; for(let i=0;i<=N;i++) ZS.push(0.5+430*Math.pow(i/N,1.75));
const segIdx = z => { let lo=0,hi=N-1; while(lo<hi){ const m=(lo+hi+1)>>1; if(ZS[m]<=z) lo=m; else hi=m-1; } return lo; };
const segItems = ZS.map(()=>[]);
const DL=[];
const xbOf = z => { const a=head(z); const lx=L[0]*Math.cos(a)-L[2]*Math.sin(a); if(lx<=0.01) return 99; return 14.8 - 16.6*lx/L[1]; };

for(let i=0;i<N;i++){
  const z0=ZS[i], z1=ZS[i+1], zm=(z0+z1)/2, a=head(zm);
  const depth=cam.project(...W3(0,2,zm))[2];
  DL.push({d:depth, fn:()=>{
    for(let j=0;j<PV.length-1;j++){
      const A=PV[j], B=PV[j+1], du=B[0]-A[0], dv=B[1]-A[1], ll=Math.hypot(du,dv), nu=-dv/ll, nv=du/ll;
      const n=[nu*Math.cos(a), nv, -nu*Math.sin(a)];
      const pm=W3((A[0]+B[0])/2,(A[1]+B[1])/2,zm), vw=[cam.pos[0]-pm[0],cam.pos[1]-pm[1],cam.pos[2]-pm[2]];
      if(n[0]*vw[0]+n[1]*vw[1]+n[2]*vw[2] <= 0) continue;
      const dl=n[0]*L[0]+n[1]*L[1]+n[2]*L[2];
      const c=css(atm(tone(PM[j],dl,(A[1]+B[1])/2), depth));
      const floor = Math.abs(A[0])<=7.01 && Math.abs(B[0])<=7.01 && A[1]<=0.01 && B[1]<=0.01;
      if(floor){ // divide o quad na linha da sombra projetada pela parede direita
        const xb0=xbOf(z0), xb1=xbOf(z1), sc=css(atm(MAT[PM[j]].sh, depth));
        const vA=A[1], vB=B[1], vAt=(u)=>lerp(vA,vB,(u-A[0])/(B[0]-A[0]));
        if(Math.min(xb0,xb1)>A[0]){ const m0=Math.min(B[0],xb0), m1=Math.min(B[0],xb1); const q=[P(A[0],vA,z0),P(m0,vAt(m0),z0),P(m1,vAt(m1),z1),P(A[0],vA,z1)]; poly(ctx,q,c,c,1.2); }
        if(Math.max(xb0,xb1)<B[0]){ const m0=Math.max(A[0],xb0), m1=Math.max(A[0],xb1); const q=[P(m0,vAt(m0),z0),P(B[0],vB,z0),P(B[0],vB,z1),P(m1,vAt(m1),z1)]; poly(ctx,q,sc,sc,1.2); }
        continue;
      }
      const q=[P(A[0],A[1],z0),P(B[0],B[1],z0),P(B[0],B[1],z1),P(A[0],A[1],z1)];
      poly(ctx,q,c,c,1.2);
    }
    for(const it of segItems[i]) it();
  }});
}
const inShadow=(u,z)=>u>xbOf(z);
function addSeg(z, fn){ segItems[segIdx(z)].push(fn); }

// ---------- detalhes pintados nas paredes ----------
seed(31);
for(let k=0;k<900;k++){ // escorridos verticais
  const sd=R()<0.5?-1:1, z=rnd(1,330), v0=rnd(9,13.5), len=rnd(1.5,6), w=rnd(0.08,0.35);
  addSeg(z, ()=>{ const a=P(sd*14,v0,z), b=P(sd*14,v0-len,z); const d=a[2]; const base=sd<0? (head(z)>0.5?MAT.wall.sh:MAT.wall.lo) : (head(z)>0.48?MAT.wall.mid:MAT.wall.sh);
    ctx.strokeStyle=css(atm(shadowOf(base,'#6a6090',0.85,0.2),d), rnd(0.12,0.35)); ctx.lineWidth=Math.max(1,w*cam.f/d); ctx.lineCap='round'; ctx.beginPath(); ctx.moveTo(a[0],a[1]); ctx.lineTo(b[0],b[1]); ctx.stroke(); });
}
for(let k=0;k<260;k++){ // musgo pendurado na borda
  const sd=R()<0.5?-1:1, z=rnd(1,330), len=rnd(0.4,2.4), w=rnd(0.6,2.2);
  addSeg(z, ()=>{ const a=P(sd*14.85,15.9,z), b=P(sd*14.85,15.9-len,z), c=P(sd*14.85,15.9,z+w); const d=a[2];
    const col=css(atm(inShadow(sd*14,z)&&sd>0?'#5d7e62':'#7fa65a',d));
    ctx.fillStyle=col; ctx.beginPath(); ctx.moveTo(a[0],a[1]); ctx.quadraticCurveTo(b[0],b[1]+(b[1]-a[1])*0.2,c[0],c[1]); ctx.closePath(); ctx.fill(); });
}
// glifos na faixa laranja
for(let z=2; z<330; z+=rnd(1.2,2.2)){
  for(const sd of [-1,1]){ const zz=z, g=R();
    addSeg(zz, ()=>{ const d=P(sd*14.8,15,zz)[2]; if(d>220) return; const col=css(atm(sd<0&&head(zz)<0.5?'#8e3e2a':'#6e3a48',d),0.75);
      ctx.strokeStyle=col; ctx.lineWidth=Math.max(1,0.14*cam.f/d); ctx.lineCap='butt';
      const seg=(u1,v1,u2,v2)=>{ const p=P(sd*14.79,v1,zz+u1), q=P(sd*14.79,v2,zz+u2); ctx.beginPath(); ctx.moveTo(p[0],p[1]); ctx.lineTo(q[0],q[1]); ctx.stroke(); };
      if(g<0.33){ seg(0,14.3,0,15.7); seg(0,15.7,0.6,15.7); seg(0.6,15.7,0.6,15.0); }
      else if(g<0.66){ seg(0,14.4,0.7,14.4); seg(0.35,14.4,0.35,15.6); seg(0,15.6,0.7,15.6); }
      else { seg(0,15,0.7,15); seg(0.7,14.3,0.7,15.7); seg(0,15.7,0,15.2); } });
  }
}
// bueiros em arco na base das paredes (como no circuito do Oban)
function wallArc(sd,th,z){ return [sd*(7+7*Math.sin(th)), 7-7*Math.cos(th), z]; }
for(let z=14; z<300; z+=rnd(18,28)){
  for(const sd of [-1,1]){ const z0=z+rnd(-3,3);
    addSeg(z0-1.6, ()=>{ const pts=[]; const hw=1.6, th0=0.95, th1=0.5;
      for(let t=0;t<=1;t+=0.1) pts.push(wallArc(sd,th0,z0-hw+2*hw*t));
      for(let t=0;t<=1;t+=0.05){ const ang=Math.PI*t; pts.push(wallArc(sd,th0+th1*(0.55+0.45*Math.sin(ang)), z0+hw*Math.cos(ang))); }
      const sp=pts.map(p=>P(...p)); const d=sp[0][2]; if(d<1) return;
      const dark=css(atm('#3b3550',d)), rim=css(atm('#fff6e2',d));
      poly(ctx,sp,dark); ctx.strokeStyle=css(atm('#c9b590',d)); ctx.lineWidth=Math.max(1,0.25*cam.f/d); pathPts(ctx,sp,true); ctx.stroke();
      ctx.strokeStyle=css(atm('#5a5270',d)); ctx.lineWidth=Math.max(1,0.09*cam.f/d);
      for(let b=-1.1;b<=1.1;b+=0.44){ const p=P(...wallArc(sd,th0+0.01,z0+b)), q=P(...wallArc(sd,th0+th1*0.9,z0+b)); ctx.beginPath(); ctx.moveTo(p[0],p[1]); ctx.lineTo(q[0],q[1]); ctx.stroke(); }
    });
  }
}
// tufos de grama e pedras brancas no chão
seed(41);
for(let k=0;k<1400;k++){ // manchas de cor na grama
  const z=1+Math.pow(R(),1.8)*240, u=rnd(-7,7), r=rnd(0.4,1.6); if(Math.abs(u)<2.4) continue; const sh=inShadow(u,z);
  const col= sh? pick(['#4f7f72','#638f79','#557a74']) : pick(['#b9da78','#8ebd5c','#a2cb69','#7aab53']);
  addSeg(z, ()=>{ const p=P(u,0,z), d=p[2], s=cam.f/d; ellipse(ctx,p[0],p[1],r*s,r*s*0.22,css(atm(col,d),0.7)); });
}
for(let k=0;k<7000;k++){
  const z=1+Math.pow(R(),2.0)*240, u=rnd(-7.3,7.3); if(Math.abs(u)<2.3 && R()<0.85) continue;
  const sh=inShadow(u,z), hgt=rnd(0.12,0.45), lean=rnd(-0.12,0.12);
  const base= sh? pick(['#4e7d6c','#6a9a7e','#46705f','#7aa58a']) : pick(['#d2ea8a','#8dbb58','#75a64f','#b6d873','#e6f2a0']);
  addSeg(z, ()=>{ const p=P(u,0,z), d=p[2], q=P(u+lean,hgt,z);
    ctx.strokeStyle=css(atm(base,d)); ctx.lineWidth=Math.max(0.8,0.05*cam.f/d); ctx.lineCap='round'; ctx.beginPath(); ctx.moveTo(p[0],p[1]); ctx.quadraticCurveTo(p[0],(p[1]+q[1])/2,q[0],q[1]); ctx.stroke(); });
}
for(let k=0;k<140;k++){
  const z=2+Math.pow(R(),1.6)*200, u=rnd(-6.5,6.5), r=rnd(0.2,0.7); const sh=inShadow(u,z);
  addSeg(z, ()=>{ const p=P(u,0,z), d=p[2], s=cam.f/d; ellipse(ctx,p[0],p[1],r*s,r*s*0.32,css(atm(sh?'#9fa6c6':'#f3f0e4',d))); ellipse(ctx,p[0]-r*s*0.15,p[1]-r*s*0.08,r*s*0.6,r*s*0.16,css(atm(sh?'#b5bad6':'#ffffff',d),0.8)); });
}
// reflexos do riacho
for(let k=0;k<600;k++){
  const z=1+Math.pow(R(),1.8)*260, u=rnd(-1.9,1.9), len=rnd(0.6,3);
  addSeg(z, ()=>{ const p=P(u,-0.22,z), q=P(u,-0.22,z+len), d=p[2]; const sh=inShadow(u,z);
    ctx.strokeStyle=css(atm(sh?'#a9c6dd':'#ffffff',d), rnd(0.35,0.8)); ctx.lineWidth=Math.max(1,0.1*cam.f/d); ctx.beginPath(); ctx.moveTo(p[0],p[1]); ctx.lineTo(q[0],q[1]); ctx.stroke(); });
}

// ---------- construções e árvores sobre as bordas ----------
function sprite(u,v,z,draw){ const w=W3(u,v,z), p=cam.project(...w); if(p[2]<2) return; DL.push({d:p[2], fn:()=>draw(p[0],p[1],cam.f/p[2],p[2])}); }
function acacia(x,y,s,d,h){
  const tr=css(atm('#4a3b3a',d)); ctx.strokeStyle=tr; ctx.lineCap='round';
  ctx.lineWidth=Math.max(1,0.35*s); ctx.beginPath(); ctx.moveTo(x,y); ctx.quadraticCurveTo(x-0.4*s,y-h*0.4*s,x+0.3*s,y-h*0.75*s); ctx.stroke();
  ctx.lineWidth=Math.max(1,0.2*s); ctx.beginPath(); ctx.moveTo(x-0.1*s,y-h*0.45*s); ctx.quadraticCurveTo(x-h*0.25*s,y-h*0.6*s,x-h*0.42*s,y-h*0.72*s); ctx.stroke();
  for(const [ox,oy,rx] of [[0.3,0.8,0.55],[-0.42,0.74,0.4],[0.05,0.95,0.38]]){
    const cx=x+ox*h*s, cy=y-oy*h*s, r=rx*h*s;
    poly(ctx, blobPts(cx,cy+r*0.12,r,r*0.26,0.15,40,ox*10), css(atm('#2c5246',d)));
    poly(ctx, blobPts(cx+r*0.05,cy,r*0.92,r*0.2,0.15,40,ox*10+3), css(atm('#4f8a59',d)));
    poly(ctx, blobPts(cx+r*0.25,cy-r*0.06,r*0.5,r*0.1,0.2,30,ox*10+6), css(atm('#86b766',d)));
  }
}
function pod(x,y,s,d,o){
  const w=o.w*s, h=o.h*s, lit=atm('#f1e6cb',d), sh=atm('#a29dbd',d), line=css(atm('#6d6487',d),0.7);
  const legs=o.type==='stilt'?h*0.5:0, bh=h-legs, by=y-legs;
  if(legs){ ctx.strokeStyle=css(atm('#5b4b55',d)); ctx.lineWidth=Math.max(1,0.3*s); for(const lx of [-0.35,0,0.35]){ ctx.beginPath(); ctx.moveTo(x+lx*w,y); ctx.lineTo(x+lx*w*0.6,by-bh*0.2); ctx.stroke(); }
    ctx.lineWidth=Math.max(1,0.12*s); for(let t=0.15;t<1;t+=0.18){ ctx.beginPath(); ctx.moveTo(x-0.33*w+0.1*w*t,y-legs*t); ctx.lineTo(x+0.33*w-0.1*w*t,y-legs*t); ctx.stroke(); } }
  const body=()=>{ ctx.beginPath(); if(o.type==='silo'){ ctx.moveTo(x-w/2,by); ctx.lineTo(x-w/2,by-bh+w/2); ctx.arc(x,by-bh+w/2,w/2,Math.PI,0); ctx.lineTo(x+w/2,by); ctx.closePath(); }
    else { ctx.ellipse(x,by-bh*0.48,w/2,bh*0.5,0,0,TAU); } };
  body(); ctx.fillStyle=css(sh); ctx.fill();
  ctx.save(); body(); ctx.clip(); ellipse(ctx,x+w*0.24,by-bh*0.55,w*0.62,bh*0.75,css(lit)); ellipse(ctx,x+w*0.36,by-bh*0.62,w*0.18,bh*0.5,css(mix(lit,'#ffffff',0.5)));
  if(o.band){ ctx.fillStyle=css(atm('#d66e3e',d)); ctx.fillRect(x-w,by-bh*0.78,w*2,bh*0.08); ctx.fillStyle=css(atm('#9c4d48',d)); ctx.fillRect(x-w,by-bh*0.78,w*0.75,bh*0.08); }
  ellipse(ctx,x,by-bh-bh*0.02,w*0.55,bh*0.1,css(atm('#7fae5c',d))); ellipse(ctx,x+w*0.1,by-bh-bh*0.04,w*0.35,bh*0.05,css(atm('#a5cc6e',d)));
  ctx.restore(); body(); ctx.strokeStyle=line; ctx.lineWidth=Math.max(0.8,0.1*s); ctx.stroke();
  for(const [wx,wy,wr] of o.win){ const cx=x+wx*w, cy=by-wy*bh, r=Math.max(1,wr*w);
    ellipse(ctx,cx,cy,r,r*1.1,css(atm('#d98a4c',d))); ellipse(ctx,cx,cy,r*0.72,r*0.8,css(atm('#352c3e',d))); }
  if(o.tree) acacia(x+o.tree*w*0.2, by-bh*0.98, s, d, o.h*0.45);
}
seed(51);
for(let z=8; z<360; z+=rnd(6,14)){
  for(const sd of [-1,1]){ if(R()<0.25) continue;
    const u=sd*rnd(17,50), t=R(), h=rnd(9,26), w=rnd(4.5,8.5);
    const type=t<0.45?'egg':t<0.8?'silo':'stilt';
    const win=[]; const nw=rndi(1,4); for(let k=0;k<nw;k++) win.push([rnd(-0.25,0.3),rnd(0.3,0.8),rnd(0.06,0.11)]);
    const o={type,h,w,win,band:R()<0.5,tree:R()<0.35?rnd(-1,1):0};
    sprite(u,16.6,z,(x,y,s,d)=>pod(x,y,s,d,o));
  }
  for(const sd of [-1,1]) if(R()<0.55){ const u=sd*rnd(15.5,30), h=rnd(5,9); sprite(u,16.6,z+rnd(0,6),(x,y,s,d)=>acacia(x,y,s,d,h)); }
}

// ---------- ponte de pedra e cano gigante ----------
function bridge(zb){
  const a=head(zb), Q=(u,v,z)=>{ const x=xc(zb)+u*Math.cos(a)+(z-zb)*Math.sin(a), zz=zb-u*Math.sin(a)+(z-zb)*Math.cos(a); return cam.project(x,v,zz); };
  const d=Q(0,20,zb)[2];
  DL.push({d:d-1, fn:()=>{
    const c=(col)=>css(atm(col,d));
    poly(ctx,[Q(-30,19.5,zb),Q(30,19.5,zb),Q(30,19.5,zb+5),Q(-30,19.5,zb+5)], c('#9a95b6'));
    for(const sd of [-1,1]) for(const uu of [18,25]) poly(ctx,[Q(sd*uu,16.6,zb+0.5),Q(sd*(uu+2),16.6,zb+0.5),Q(sd*(uu+2),19.6,zb+0.5),Q(sd*uu,19.6,zb+0.5)], c(sd>0?'#f2e6cc':'#b5aecb'));
    poly(ctx,[Q(-30,19.5,zb),Q(30,19.5,zb),Q(30,22.5,zb),Q(-30,22.5,zb)], c('#e8dbbd'));
    poly(ctx,[Q(-30,20.2,zb-0.01),Q(30,20.2,zb-0.01),Q(30,21.3,zb-0.01),Q(-30,21.3,zb-0.01)], c('#d66e3e'));
    ctx.strokeStyle=c('#8a4a5a'); ctx.lineWidth=Math.max(1,0.15*cam.f/d);
    for(let u=-29;u<29;u+=1.6){ const p=Q(u,20.4,zb-0.02), q=Q(u,21.1,zb-0.02), r=Q(u+0.8,21.1,zb-0.02); ctx.beginPath(); ctx.moveTo(p[0],p[1]); ctx.lineTo(q[0],q[1]); ctx.lineTo(r[0],r[1]); ctx.stroke(); }
    for(let u=-29;u<=29;u+=2.4){ poly(ctx,[Q(u,22.5,zb+0.3),Q(u+0.3,22.5,zb+0.3),Q(u+0.3,24,zb+0.3),Q(u,24,zb+0.3)], c('#5b4b55')); }
    const p1=Q(-30,23.7,zb+0.3), p2=Q(30,23.7,zb+0.3); ctx.strokeStyle=c('#5b4b55'); ctx.lineWidth=Math.max(1,0.18*cam.f/d); ctx.beginPath(); ctx.moveTo(p1[0],p1[1]); ctx.lineTo(p2[0],p2[1]); ctx.stroke();
    // bandeirinhas
    const cols=['#ff7aa8','#ffd36e','#5fd0c8','#fff4e0','#e5483a'];
    let prev=null; ctx.lineWidth=Math.max(1,0.06*cam.f/d);

(function pipe(zb){ const a=head(zb), Q=(u,v)=>cam.project(xc(zb)+u*Math.cos(a), v, zb-u*Math.sin(a)); const d=Q(0,26)[2];

// ---------- obstáculos e itens (variante de gameplay: ?hud=1) ----------
if(location.search.includes('hud')){
  function box(u0,u1,h,z0,z1,cols){ const zc=(z0+z1)/2;

      ctx.fillStyle=css('#7ff6ff',0.95); for(let u=u0+0.5;u<u1-0.3;u+=0.9){ const q=C(u,h*0.35,z0-0.01); ctx.beginPath(); ctx.moveTo(q[0],q[1]-0.25*s); ctx.lineTo(q[0]+0.15*s,q[1]); ctx.lineTo(q[0],q[1]+0.25*s); ctx.lineTo(q[0]-0.15*s,q[1]); ctx.closePath(); ctx.fill(); }
      const m=C((u0+u1)/2,h*0.35,z0); glow(ctx,m[0],m[1],(u1-u0)*0.6*s,'#7ff6ff',0.25);

    ctx.fillStyle=css('#ffe9a3'); ctx.beginPath(); ctx.moveTo(p[0],p[1]-0.5*s); ctx.lineTo(p[0]+0.3*s,p[1]); ctx.lineTo(p[0],p[1]+0.5*s); ctx.lineTo(p[0]-0.3*s,p[1]); ctx.closePath(); ctx.fill();
    ctx.fillStyle=css('#ff9d2e'); ctx.beginPath(); ctx.moveTo(p[0],p[1]-0.5*s); ctx.lineTo(p[0]+0.3*s,p[1]); ctx.lineTo(p[0],p[1]+0.5*s); ctx.closePath(); ctx.fill(); }); }
